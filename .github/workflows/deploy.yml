name: Build & Deploy UAT

on:
  push:
    branches: [uat]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tedev555/hms

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=uat

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.uat.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.uat.yml"
          target: "~/hms"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail

            cd ~/hms

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Set image tag for compose
            export IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat"

            # Pull the latest image
            docker pull "$IMAGE_TAG"

            # Start infrastructure services first
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.uat.yml up -d hms-db hms-redis hms-minio

            # Sync database schema for UAT
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.uat.yml run --rm --user root hms-app node ./node_modules/prisma/build/index.js db push --skip-generate

            # Seed UAT sample data when bootstrap records are missing
            LAB_ORDER_COUNT=$(docker compose -f docker-compose.uat.yml exec -T hms-db psql -U hms_user -d hms_db -tAc "SELECT COUNT(*) FROM public.lab_orders;")
            if [ "$LAB_ORDER_COUNT" = "0" ]; then
              IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.uat.yml run --rm --user root hms-app node ./node_modules/tsx/dist/cli.mjs prisma/seed.ts
            fi

            # Deploy with docker compose
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.uat.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f
